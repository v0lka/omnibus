# Omnibus CI — the Manjaro-own matrix (roadmap task 2.4.1).
#
# Manjaro is T1 with its own test matrix: alpm/journald/systemd1/atspi behave
# as on Arch; the differences (delayed repos, mhwd drivers, pamac) are probe
# facts, not quiet divergences. This workflow owns the Manjaro side:
#
#   manjaro-container — the gate + test suites + smoke demos inside a
#                       manjaro/base-devel container (driven through
#                       `docker run` so the tolerance is scopeable). ONLY the
#                       image pull is tolerated (step-level continue-on-error):
#                       the rolling community tag can be unpullable and that is
#                       an infrastructure miss. Every failure inside the
#                       container — gate, tests, smoke — is green-blocking.
#   arch-fallback     — the same gate + smoke on an archlinux:base-devel
#                       container, always green-blocking. Documented stand-in:
#                       Manjaro is the arch family, so this is a smoke signal,
#                       NOT the T1 guarantee — the guarantee lives on hardware.
#   manjaro-vm-matrix — the true T1 legs (GNOME/KDE x X11/Wayland on Manjaro
#                       VMs with non-free mhwd video drivers). Manual-dispatch
#                       only, skipped by default until real runners exist
#                       (TODO markers below).
#
# The acceptance record is docs/verification/ms1-ms2-manjaro-acceptance.md.
# Until the VM legs exist, every run of this workflow must print which legs
# were container-stand-ins and which were real.

name: manjaro

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:17 UTC — the Manjaro track is not per-PR (the main
    # `ci` workflow already gates every push/PR); this matrix guards drift.
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: manjaro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  manjaro-container:
    name: manjaro/base-devel container (gate + suites + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Published for leg-classification: only 'success' means the container leg
    # actually ran; 'failure' means the pull (the one tolerated step) failed
    # and gate + suites + smoke were skipped for this run.
    outputs:
      image_pull: ${{ steps.manjaro_image.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull the Manjaro image (the only tolerated failure)
        id: manjaro_image
        # Scoped to this step ON PURPOSE. A job-level continue-on-error would
        # neutralize the gate itself; a failed pull of the rolling community
        # image is an infrastructure miss, not a code regression. Everything
        # that runs inside the container below stays green-blocking.
        continue-on-error: true
        run: docker pull manjaro/base-devel

      - name: Warn when the Manjaro image is unpullable (infra miss)
        if: steps.manjaro_image.outcome == 'failure'
        run: |
          echo "::warning::manjaro/base-devel could not be pulled — the Manjaro container leg (gate + suites + smoke) is skipped for this run. Only the image pull is tolerated; gate, test or smoke failures inside the container would fail (block) this job."

      - name: Gate + suites + smoke inside the Manjaro container
        if: steps.manjaro_image.outcome == 'success'
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            manjaro/base-devel \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory /work
              # python: make specs runs specs/tools/validate_specs.py, and the
              # smoke demos drive the MCP client through python3 heredocs.
              pacman -Syu --noconfirm --needed git rust at-spi2-core python
              make specs
              cargo fmt --all -- --check
              cargo clippy --workspace --all-targets -- -D warnings
              cargo run -p omnibus-lints --bin omnibus-lints
              cargo test -p omnibus-lints --test fixtures
              cargo build --workspace
              cargo test --workspace
              ci/smoke/run-demos.sh
            '

      - name: Restore workspace ownership (the container leg ran as root)
        if: always()
        # The leg builds into the mounted workspace as root, which leaves a
        # root-owned target/ behind; on a persistent (self-hosted) runner the
        # next checkout would then fail to clean it. Best effort on purpose
        # (step-level continue-on-error): a failed chown — e.g. the image
        # never pulled — must not mask the real job result.
        continue-on-error: true
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            manjaro/base-devel \
            chown -R "$(id -u):$(id -g)" /work

  arch-fallback:
    name: archlinux fallback container (gate + suites + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and session deps (pacman)
        run: |
          set -euo pipefail
          # python: make specs runs specs/tools/validate_specs.py, and the
          # smoke demos drive the MCP client through python3 heredocs.
          pacman -Syu --noconfirm --needed git rust at-spi2-core python

      - name: Gate (specs + lint)
        run: |
          set -euo pipefail
          make specs
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo run -p omnibus-lints --bin omnibus-lints
          cargo test -p omnibus-lints --test fixtures

      - name: Build + full test suite
        run: |
          set -euo pipefail
          cargo build --workspace
          cargo test --workspace

      - name: Smoke demos 1-3
        run: ci/smoke/run-demos.sh

  manjaro-vm-matrix:
    name: Manjaro VM ${{ matrix.de }} / ${{ matrix.session }} (mhwd non-free)
    # TODO(roadmap 2.4.1): this job stays SKIPPED until the true-VM legs exist:
    #
    #   1. Provision four Manjaro VMs, one per combo below, each with the
    #      non-free mhwd video driver for its GPU (the 2.4.1 AC "mhwd
    #      specifics do not break the desktop subsystem" is only meaningful
    #      on real drivers, never in a container).
    #   2. Register them as self-hosted runners labeled exactly:
    #      manjaro-gnome-x11, manjaro-gnome-wayland,
    #      manjaro-kde-x11,   manjaro-kde-wayland.
    #   3. Add the repo variable MANJARO_VM_ENABLED=true (Settings -> Secrets
    #      and variables -> Actions -> Variables). While it is unset or false,
    #      this job evaluates to false and is skipped — by design, so the
    #      workflow never fakes a green VM matrix.
    #   4. Follow docs/verification/ms1-ms2-manjaro-acceptance.md (the landed
    #      MS1+MS2 acceptance record; these VM legs re-run its checklist)
    #      including the delayed-repo probe observation AC.
    if: github.event_name == 'workflow_dispatch' && vars.MANJARO_VM_ENABLED == 'true'
    runs-on: ${{ matrix.runner-label }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - de: gnome
            session: x11
            runner-label: manjaro-gnome-x11
          - de: gnome
            session: wayland
            runner-label: manjaro-gnome-wayland
          - de: kde
            session: x11
            runner-label: manjaro-kde-x11
          - de: kde
            session: wayland
            runner-label: manjaro-kde-wayland
    env:
      DE: ${{ matrix.de }}
      SESSION: ${{ matrix.session }}
    steps:
      # TODO(roadmap 2.4.1): on the VMs the runner user owns the session; the
      # suite runs against the REAL desktop (no Xvfb here).
      - uses: actions/checkout@v4

      - name: Gate (specs + lint)
        run: |
          set -euo pipefail
          make specs
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo run -p omnibus-lints --bin omnibus-lints
          cargo test -p omnibus-lints --test fixtures

      - name: Build + full test suite
        run: |
          set -euo pipefail
          cargo build --workspace
          cargo test --workspace

      - name: Smoke demos 1-3 against the real session
        # On real VM legs the a11y/journal/package legs must actually run:
        # a SKIP here means a broken session, not an honest absence.
        run: ci/smoke/run-demos.sh

      - name: Probe report — mhwd and delayed repos must be visible
        # AC 2.4.1 guard (implemented): the probe must surface the Manjaro
        # facts — delayed repos, mhwd, pamac — instead of reporting silence.
        # The report is the daemon's serve-mode startup banner on stderr
        # (omnibusd/src/main.rs, serve()):
        #   omnibusd: distro=<id> release=<rel> manjaro(delayed_repos=<bool>, mhwd=<bool>, pamac=<bool>)
        # The manjaro block is printed only when the probe detected the
        # Manjaro family; the fallback line without it is probe silence, and
        # that is exactly what this step fails on. (The `omnibusd doctor` CLI
        # prints distro/kernel/desktop but NOT these facts, so the banner is
        # the assertion surface.)
        # One stdio session with stdin already closed: the client is gone, so
        # the daemon prints the banner and the session ends — status 1 with
        # "connection closed: initialize request" is the expected shutdown
        # here; the greps below are the gate, not the exit status.
        run: |
          set -euo pipefail
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          probe_status=0
          ./target/debug/omnibusd </dev/null 2>"$report" || probe_status=$?
          echo "omnibusd exited with status ${probe_status} after stdin EOF (the session ends with its client; expected)"
          cat "$report"
          missing=""
          grep -q 'manjaro(delayed_repos=' "$report" || missing="$missing manjaro-facts-banner(absent: the probe did not surface Manjaro facts at all)"
          grep -q 'delayed_repos=true' "$report" || missing="$missing delayed_repos=true"
          grep -q 'mhwd=true' "$report" || missing="$missing mhwd=true"
          grep -q 'pamac=true' "$report" || missing="$missing pamac=true"
          if [ -n "$missing" ]; then
            echo "::error::probe report does not surface the required Manjaro facts (roadmap AC 2.4.1); missing or false:$missing"
            exit 1
          fi
          echo "probe report surfaces the Manjaro facts (delayed repos, mhwd, pamac) — AC 2.4.1 guard green"

  # The header promises every run prints which legs were container stand-ins
  # and which were real; this job is that print (always runs, green or red).
  leg-classification:
    name: print the leg classification (stand-in vs real)
    needs: [manjaro-container, arch-fallback, manjaro-vm-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify this run's legs
        run: |
          echo "leg classification for this run:"
          # The container leg's claim must match what actually ran: when the
          # tolerated image pull failed, gate + suites + smoke were skipped —
          # never report a skipped leg as executed.
          if [ "${{ needs.manjaro-container.outputs.image_pull }}" = "failure" ]; then
            echo "  manjaro-container: SKIPPED — manjaro/base-devel image unpullable (infra miss); gate + suites + smoke did NOT run this time"
          else
            echo "  manjaro-container: container stand-in (gate + suites + smoke)"
          fi
          echo "  arch-fallback:     container stand-in (smoke signal, not the T1 guarantee)"
          # The VM legs need BOTH conditions their job gates on: a manual
          # dispatch AND the variable. A scheduled run with the variable set
          # still skips them — the classification must say so, never claim a
          # real leg that did not run.
          echo "  manjaro-vm-matrix: ${{ github.event_name == 'workflow_dispatch' && vars.MANJARO_VM_ENABLED == 'true' && 'real VM legs (dispatched, MANJARO_VM_ENABLED=true)' || 'skipped (scheduled run or MANJARO_VM_ENABLED unset/false) — container stand-ins only' }}"
