# Omnibus CI — the main pipeline (roadmap tasks 1.1.3, 1.8.2; 2.4.1 Arch legs).
#
# Job map:
#   gate             — specs + fmt + clippy + build + test + the four R4 lints
#                      and their red/green fixtures (Makefile targets, 1.1.3 AC:
#                      "CI runs fmt/clippy/test/lints on every PR").
#   dependency-rules — the R4-EDGES tool on the real tree, plus an in-job negative
#                      check: a forbidden edge (adapter -> core) is injected into a
#                      scratch clone in /tmp and the lint must turn red (the
#                      "proven by a test PR" AC of 1.1.2/1.1.3, as an inline step).
#   matrix-t1        — X11/Wayland on Arch containers (1.8.2): Xvfb or
#                      a headless Wayland compositor, best-effort (a missing
#                      compositor never fails the job; a test failure always does),
#                      then cargo test + the three smoke demos (ci/smoke/).
#                      No desktop-session (GNOME/KDE) axis on purpose: no step
#                      consumes it yet, so the axis would only double the legs
#                      byte-identically (R7) — introduce it together with the
#                      first step that actually branches on the session type.
#                      The Manjaro side of the matrix is owned by manjaro.yml and
#                      the run-on-hardware legs by the acceptance runbook
#                      (docs/verification/ms1-ms2-manjaro-acceptance.md).
#   coverage         — cargo-llvm-cov line-coverage floor of 75%.
#   package-build    — honest packaging validation on an Arch container: PKGBUILD
#                      bash syntax, makepkg's own parse (--printsrcinfo), and
#                      structural checks that package() installs exactly the
#                      artifact paths build() produces (when packaging/ exists)
#                      + a release build of the workspace.
#
# A red gate has no override (Makefile note): every job below must stay green
# on main; pulls run the same commands.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: gate (specs + lint + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Spec system validation
        run: make specs

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets, warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test (contract suite, R4 fixtures, security and ladder seeds)
        run: cargo test --workspace

      - name: R4 boundary lints on the real tree
        run: cargo run -p omnibus-lints --bin omnibus-lints

      - name: R4 red/green fixtures
        run: cargo test -p omnibus-lints --test fixtures

  dependency-rules:
    name: dependency rules (R4-EDGES, negative check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lints-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lints-

      - name: Lints green on the real tree
        run: cargo run -p omnibus-lints --bin omnibus-lints

      - name: Negative check — a forbidden edge must turn the lint red
        run: |
          set -euo pipefail
          # Scratch clone in /tmp: the checked-out repo is never modified; the
          # lints scan manifests as text, so no build of the clone is needed.
          NEGATIVE_DIR="$(mktemp -d /tmp/omnibus-negative.XXXXXX)"
          trap 'rm -rf "$NEGATIVE_DIR"' EXIT
          tar --exclude=./target --exclude=./.git -cf - . | tar -xf - -C "$NEGATIVE_DIR"

          # Sanity: the untouched clone must be green, like the real tree.
          cargo run --quiet -p omnibus-lints --bin omnibus-lints -- "$NEGATIVE_DIR" \
            || { echo "::error::scratch clone is red before the injection — the check is not measuring anything"; exit 1; }

          # Inject the forbidden edge adapter -> core into the clone's copy of
          # the alpm adapter manifest (roadmap 1.1.2 AC: the dependency job
          # "falls when a forbidden edge is added", proven here in-job).
          sed -i '/^\[dependencies\]$/a omnibus-core = { path = "../omnibus-core" }' \
            "$NEGATIVE_DIR/omnibus-adapter-alpm/Cargo.toml"
          grep -A1 '^\[dependencies\]$' "$NEGATIVE_DIR/omnibus-adapter-alpm/Cargo.toml" | head -3

          set +e
          OUTPUT="$(cargo run --quiet -p omnibus-lints --bin omnibus-lints -- "$NEGATIVE_DIR" 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::the forbidden edge (adapter -> omnibus-core) was NOT detected — R4-EDGES is not enforcing the boundary"
            exit 1
          fi
          if ! grep -q 'R4-EDGES' <<<"$OUTPUT"; then
            echo "::error::the lint turned red for the wrong rule — expected R4-EDGES findings"
            exit 1
          fi
          echo "negative check OK: the forbidden edge is red (R4-EDGES), the direction is enforced"

  matrix-t1:
    name: T1 matrix ${{ matrix.session }} (Arch container)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Single axis on purpose: no step branches on the desktop session
        # type (GNOME vs KDE would be byte-identical container legs — see
        # the job-map header). Reintroduce a `de` axis only with the first
        # step that actually consumes it.
        session: [x11, wayland]
    container:
      image: archlinux:base-devel
    env:
      SESSION: ${{ matrix.session }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and session dependencies (pacman)
        run: |
          set -euo pipefail
          # python: the smoke demos drive the MCP client through `python3 -`
          # heredocs (ci/smoke/mcp_client.py); without it every demo leg dies
          # with exit 127 before asserting anything.
          # xorg-server-xvfb: the Xvfb binary's actual Arch package (plain
          # "xvfb" does not exist in the repos and would abort the install
          # step — and with it both matrix legs — under set -e).
          pacman -Syu --noconfirm --needed git rust python at-spi2-core xorg-server-xvfb
          # X11 legs get Xvfb + a window manager; Wayland legs get Weston's
          # headless backend. Both are best-effort (see the next step).
          if [ "$SESSION" = "x11" ]; then
            pacman -S --noconfirm --needed openbox
          else
            pacman -S --noconfirm --needed weston
          fi

      - name: Start the headless session (best-effort, GUI leg only)
        continue-on-error: true
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          # Persisted so the later daemon launches (cargo test, smoke demos)
          # resolve the cross-process write-gate lock path and exercise the
          # flock half of the gate, not only its process-only degradation.
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime" >> "$GITHUB_ENV"
          if [ "$SESSION" = "x11" ]; then
            Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
            sleep 2
            DISPLAY=:99 openbox &
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
          else
            weston --headless --socket=wayland-0 &
            sleep 2
            echo "WAYLAND_DISPLAY=wayland-0" >> "$GITHUB_ENV"
          fi
          echo "session leg: $SESSION (headless in container)"

      - name: Test the whole workspace
        run: cargo test --workspace

      - name: Smoke demos 1-3 (honest skips when a backend is absent)
        run: ci/smoke/run-demos.sh

  coverage:
    name: coverage (lines >= 75%)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with llvm-tools-preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage summary with the 75% line floor
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 75

  package-build:
    name: packaging (Arch container)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (pacman)
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git rust

      - name: PKGBUILD validation (honest subset)
        run: |
          set -euo pipefail
          # A plain container cannot run a full `makepkg -f` honestly (it would
          # fetch sources and install makedepends for a package that is not
          # defined yet). What a container CAN validate without lying:
          #   1. PKGBUILD bash syntax;
          #   2. makepkg's own parse of the recipe (--printsrcinfo);
          #   3. structural package()-path consistency: package() must install
          #      exactly the artifact paths build() produces, and the source
          #      files it reads must exist relative to the PKGBUILD. This is
          #      the class of breakage a pure syntax check cannot see (e.g. a
          #      binary path pointing at packaging/target instead of the
          #      workspace-root target/).
          # The real package build is the AUR/release channel's job (roadmap
          # 1.8.1 / 2.6.1).
          if [ -f packaging/PKGBUILD ]; then
            bash -n packaging/PKGBUILD
            ( cd packaging && makepkg --printsrcinfo > /dev/null )
            grep -Fq 'cd "$startdir/.."' packaging/PKGBUILD \
              || { echo "::error::build() must compile the workspace root: cd \"\$startdir/..\" (cargo's upward search from packaging/ otherwise hides where the artifacts land)"; exit 1; }
            grep -Fq '$startdir/../target/release/omnibusd' packaging/PKGBUILD \
              || { echo "::error::package() must install the workspace-root artifact \$startdir/../target/release/omnibusd"; exit 1; }
            ls packaging/scopes.d/*.toml > /dev/null \
              || { echo "::error::packaging/scopes.d/*.toml missing — package() installs them verbatim"; exit 1; }
            grep -Fq '$startdir"/scopes.d/*.toml' packaging/PKGBUILD \
              || { echo "::error::package() must install \$startdir/scopes.d/*.toml (the templates next to this PKGBUILD)"; exit 1; }
            echo "packaging: PKGBUILD syntax, parse and package()-path checks passed"
          else
            echo "SKIP: packaging/PKGBUILD not present yet (lands with roadmap task 2.4.1 packaging work); nothing to lint"
          fi

      - name: Release build
        run: cargo build --release
