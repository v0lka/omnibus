[package]
name = "omnibus-adapter-kb-guides"
version.workspace = true
edition.workspace = true
description = "kb-guides adapter: knowledge base search and pages over distro docs (Debian wiki, Ubuntu docs, Mint docs, Fedora docs; roadmap 2.5.2)."

[lints]
workspace = true

[dependencies]
# Adapters depend only on omnibus-contracts (roadmap 1.1.2; lint-enforced edge).
omnibus-contracts = { path = "../omnibus-contracts" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
