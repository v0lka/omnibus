[package]
name = "omnibus-adapter-dnf"
version.workspace = true
edition.workspace = true
description = "dnf/dnf5 adapter: package read/write/history for the Fedora family; transactional undo via `dnf history undo`."

[lints]
workspace = true

[dependencies]
# Adapters depend only on omnibus-contracts (roadmap 1.1.2; lint-enforced edge).
omnibus-contracts = { path = "../omnibus-contracts" }
async-trait = "0.1"
serde_json = "1"
# rt: spawn_blocking-style bounded spawns; process: dnf/dnf5/rpm subprocesses;
# time: the per-call budget; io-util: the bounded stdout/stderr pipe reads.
tokio = { version = "1", features = ["rt", "process", "time", "io-util"] }

[dev-dependencies]
# Feature sets are additive across dependency groups: tests additionally need
# the macros behind #[tokio::test] and the paused clock (time::pause/advance)
# for the honest write-timeout legs.
tokio = { version = "1", features = ["macros", "test-util"] }
