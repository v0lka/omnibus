[package]
name = "omnibus-contracts"
version.workspace = true
edition.workspace = true
description = "Omnibus SPI seam: traits, DTOs, capability registry, error taxonomy. The ONLY shared dependency; zero OS dependencies."

[lints]
workspace = true

# Invariant (specs/architecture/layers-and-crates.md): this crate always has zero OS
# dependencies and zero dependencies on core. External dependencies are restricted to
# the serde/async allowlist by the omnibus-lints dependency-edge rule (roadmap 1.1.3).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# tokio is on the contracts allowlist (serde/async types); used by the suite's own
# in-crate reference-fake tests (rt + macros only, no OS features).
[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync"] }
