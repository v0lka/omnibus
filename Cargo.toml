[workspace]
resolver = "2"
# Crate map per specs/architecture/layers-and-crates.md (roadmap task 1.1.2).
# Dependency direction is CI/lint-enforced by the omnibus-lints crate (roadmap 1.1.3):
#   contracts <- adapters, contracts <- core, contracts <- probe;
#   adapters not-> adapters, adapters not-> core (forbidden edges).
members = [
    "omnibus-contracts",
    "omnibus-core",
    "omnibusd",
    "omnibus-probe",
    "omnibus-adapter-atspi",
    "omnibus-adapter-journald",
    "omnibus-adapter-systemd1",
    "omnibus-adapter-alpm",
    "omnibus-adapter-apt",
    "omnibus-adapter-dnf",
    "omnibus-adapter-xdg-portals",
    "omnibus-adapter-fs-xdg",
    "omnibus-adapter-kb-archwiki",
    "omnibus-adapter-kb-guides",
    "omnibus-adapter-nm",
    "omnibus-lints",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
# The seam must stay auditable: no unsafe anywhere in the workspace.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Panic-free seam: contracts/core/adapters return contract errors instead.
unwrap_used = "warn"
