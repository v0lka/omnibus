[package]
name = "omnibus-adapter-atspi"
version.workspace = true
edition.workspace = true
description = "AT-SPI2 a11y adapter: desktop tree, element addressing, typed writes, invocation."

[lints]
workspace = true

[dependencies]
# Adapters depend only on omnibus-contracts (roadmap 1.1.2; lint-enforced edge).
omnibus-contracts = { path = "../omnibus-contracts" }
async-trait = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
serde_json = "1"
