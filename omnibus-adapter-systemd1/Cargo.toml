[package]
name = "omnibus-adapter-systemd1"
version.workspace = true
edition.workspace = true
description = "systemd1 adapter: service list, status, start/stop/restart, enable/disable."

[lints]
workspace = true

[dependencies]
# Adapters depend only on omnibus-contracts (roadmap 1.1.2; lint-enforced edge).
omnibus-contracts = { path = "../omnibus-contracts" }
async-trait = "0.1"
# System-bus D-Bus client; the tokio runtime integration, no blocking API.
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = "1"
# StreamExt for the JobRemoved signal stream (zbus does not re-export one).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Call-level budgets (TimeoutError mapping) around D-Bus round trips.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
