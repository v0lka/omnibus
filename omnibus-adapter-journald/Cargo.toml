[package]
name = "omnibus-adapter-journald"
version.workspace = true
edition.workspace = true
description = "journald adapter: journal query/tail plus the audit sink (P5)."

[lints]
workspace = true

[dependencies]
# Adapters depend only on omnibus-contracts (roadmap 1.1.2; lint-enforced edge).
omnibus-contracts = { path = "../omnibus-contracts" }
async-trait = "0.1"
serde_json = "1"
# rt: spawn_blocking + the test runtime; process: journalctl subprocesses;
# time: the per-call budget; sync: unused today, kept off until needed.
tokio = { version = "1", features = ["rt", "process", "time"] }

[dev-dependencies]
# Feature sets are additive across dependency groups: tests additionally need
# the macros behind #[tokio::test].
tokio = { version = "1", features = ["macros"] }
