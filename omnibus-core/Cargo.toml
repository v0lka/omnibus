[package]
name = "omnibus-core"
version.workspace = true
edition.workspace = true
description = "Omnibus core: MCP facade, sessions, grants, audit pipeline, capabilities document, doctor. OS-agnostic; adapters arrive through the probe-assembled registry."

[lints]
workspace = true

# Internal dependency rule (specs/architecture/layers-and-crates.md, R4-EDGES):
# omnibus-contracts is the only allowed internal dependency; the core never links
# adapter crates — the composition root (the omnibusd binary crate) does.
[dependencies]
omnibus-contracts = { path = "../omnibus-contracts" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "client"] }
toml = "0.9"
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
# Virtual time for the budget/retry tests (start_paused).
tokio = { version = "1", features = ["test-util"] }
