[package]
name = "omnibus-adapter-kb-archwiki"
version.workspace = true
edition.workspace = true
description = "kb-archwiki adapter: knowledge base search and pages (ArchWiki + Manjaro overlay)."

[lints]
workspace = true

[dependencies]
# Adapters depend only on omnibus-contracts (roadmap 1.1.2; lint-enforced edge).
omnibus-contracts = { path = "../omnibus-contracts" }
async-trait = "0.1"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
# Integration tests retry transient transport blips with a backoff timer;
# the time feature stays out of the production build of the adapter.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
