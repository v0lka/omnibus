[package]
name = "omnibus-adapter-xdg-portals"
version.workspace = true
edition.workspace = true
description = "xdg-portals adapter: screenshot, clipboard, notifications via desktop portals."

[lints]
workspace = true

[dependencies]
# Adapters depend only on omnibus-contracts (roadmap 1.1.2; lint-enforced edge).
omnibus-contracts = { path = "../omnibus-contracts" }
async-trait = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
# zbus does not re-export StreamExt; the signal stream is a plain futures Stream.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
# "io-util" backs the bounded screenshot read (AsyncReadExt::take).
tokio = { version = "1", default-features = false, features = ["time", "fs", "io-util"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
serde_json = "1"
